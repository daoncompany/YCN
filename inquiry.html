<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인 문의 | (주)와이씨앤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=202608191619">
</head>
<body>

<div data-include="partials/header.html"></div>

<section class="sub-visual">
  <div class="wrap">
    <h1>CONTACT</h1>
    <p class="tagline">Get in Touch with YCN</p>
    <div class="sub-nav">
      <p class="crumb"><a href="index.html">HOME</a><i>&#8250;</i>CONTACT<i>&#8250;</i><b>온라인 문의</b></p>
      <div class="page-select">
        <select aria-label="섹션 이동">
        <option value="about.html">ABOUT</option>
        <option value="system-attendance.html">SYSTEM</option>
        <option value="3szone.html">3SZONE</option>
        <option value="notice.html" selected>CONTACT</option>
        </select>
        <select aria-label="페이지 이동">
        <option value="notice.html">공지사항</option>
        <option value="location.html">오시는 길</option>
        <option value="inquiry.html" selected>온라인 문의</option>
        </select>
      </div>
    </div>
  </div>
</section>

<nav class="pills wrap">
      <a href="notice.html">공지사항</a>
      <a href="location.html">오시는 길</a>
      <a href="inquiry.html" class="on">온라인 문의</a>
</nav>

<section class="sub-body wrap">
  <div class="sub-head">
    <span class="kicker">Contact</span>
    <h2>온라인 문의</h2>
    <p>궁금하신 점을 남겨주시면 담당자가 빠르게 연락드리겠습니다.</p>
  </div>
  <form class="form" onsubmit="return false">
    <div class="row"><label for="f-name">성함<em>*</em></label><input id="f-name" type="text" required></div>
    <div class="row"><label for="f-company">기업명</label><input id="f-company" type="text"></div>
    <div class="row"><label for="f-phone">휴대폰 번호<em>*</em></label><input id="f-phone" type="tel" required></div>
    <div class="row"><label for="f-email">이메일</label><input id="f-email" type="email"></div>
    <div class="row"><label for="f-body">제안 내용<em>*</em></label><textarea id="f-body" required></textarea></div>
    <label class="agree"><input type="checkbox" required>
      <span><a href="#" data-pop="privacy">개인정보처리방침</a>에 동의합니다.</span></label>
    <div class="submit"><button type="submit" class="btn">문의 보내기 &#8594;</button></div>
  </form>
</section>

<div data-include="partials/footer.html"></div>

<script src="js/script.js?v=202608191619"></script>
</body>
</html>
