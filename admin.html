<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>공지사항 작성 | (주)와이씨앤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css?v=202608251429">
</head>
<body>

<div data-include="partials/header.html"></div>
<section class="sub-body wrap">
  <div class="sub-head">
    <span class="kicker">Admin</span>
    <h2>공지사항 작성</h2>
    <p>작성한 글은 구글 시트에 저장되며, 홈페이지 공지사항에 바로 반영됩니다.</p>
  </div>

  <form class="form" id="notice-form">
    <div class="row">
      <label for="w-title">제목<em>*</em></label>
      <input id="w-title" name="제목" type="text" maxlength="100" required>
    </div>

    <div class="row">
      <label for="w-date">날짜</label>
      <div>
        <input id="w-date" name="작성일" type="date" required>
        <p class="hint">오늘 날짜가 자동으로 들어갑니다. 필요하면 바꿀 수 있습니다.</p>
      </div>
    </div>

    <div class="row">
      <label for="w-writer">작성자</label>
      <input id="w-writer" name="작성자" type="text" value="YCN" readonly>
    </div>

    <div class="row">
      <label for="w-body">내용<em>*</em></label>
      <textarea id="w-body" name="내용" required></textarea>
    </div>

    <div class="row">
      <label>팝업</label>
      <div>
        <label class="check"><input id="w-popup" name="팝업" type="checkbox"> 메인 화면에 팝업으로 띄우기</label>
        <p class="hint">체크하면 아래 기간 동안 메인에 팝업이 뜹니다.</p>
      </div>
    </div>

    <div class="row" id="popup-range" hidden>
      <label>팝업 기간</label>
      <div class="range">
        <input id="w-start" name="시작일" type="date" aria-label="팝업 시작일">
        <span>~</span>
        <input id="w-end" name="종료일" type="date" aria-label="팝업 종료일">
        <p class="hint">비워두면 기간 제한 없이 계속 노출됩니다.</p>
      </div>
    </div>

    <div class="row">
      <label for="w-images">이미지 첨부</label>
      <div>
        <input id="w-images" type="file" accept="image/*" multiple>
        <p class="hint">본문 아래에 이미지로 표시됩니다. 파일당 8MB 이하.</p>
      </div>
    </div>

    <div class="row">
      <label for="w-files">그 외 첨부파일</label>
      <div>
        <input id="w-files" type="file" multiple>
        <p class="hint">내려받기 링크로 표시됩니다. 파일당 8MB 이하.</p>
      </div>
    </div>

    <div class="row">
      <label for="w-pw">관리자 암호<em>*</em></label>
      <div>
        <input id="w-pw" type="password" required autocomplete="current-password">
        <p class="hint">스크립트에 설정한 암호입니다. 이 페이지는 검색에 노출되지 않지만, 주소를 아는 사람은 열 수 있으므로 암호로 막습니다.</p>
      </div>
    </div>

    <p class="form-msg" id="w-msg" role="status"></p>

    <div class="submit">
      <button type="submit" class="btn" id="w-submit">공지 등록</button>
    </div>
  </form>
</section>

<div data-include="partials/footer.html"></div>

<script src="js/notice.js?v=202608251429"></script>
<script src="js/admin.js?v=202608251429"></script>
<script src="js/script.js?v=202608251429"></script>
</body>
</html>
